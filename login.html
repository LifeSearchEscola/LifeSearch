<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Login ou cadastre-se no Life Search para salvar seus favoritos e encontrar as melhores ofertas.">
    <title>Login - Life Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <!-- LOGIN CONTENT -->
    <div class="login-wrapper">
        <div class="login-logo">
            <img src="assets/img/logo_preta.png" alt="Life Search" class="login-logo-img"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <a href="index.html" class="logo" style="display:none;">
                <div class="logo-icon">
                    <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="15" stroke="#333" stroke-width="2" />
                        <circle cx="13" cy="14" r="7" stroke="#333" stroke-width="2" fill="none" />
                        <line x1="18" y1="19" x2="24" y2="25" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <circle cx="13" cy="14" r="3" fill="#FFD700" />
                    </svg>
                </div>
                <span class="logo-text" style="font-size:24px;">Life Search</span>
            </a>
        </div>

        <div class="login-card">
            <!-- Social Login -->
            <div class="social-login">
                <h2>Entrar com:</h2>
                <div class="social-login-buttons">
                    <button class="social-btn social-google" id="btn-google">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                fill="#4285F4" />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853" />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05" />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335" />
                        </svg>
                    </button>
                    <button class="social-btn social-twitter-btn" id="btn-twitter-login">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1DA1F2">
                            <path
                                d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
                        </svg>
                    </button>
                    <button class="social-btn social-facebook-btn" id="btn-facebook-login">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <div class="login-section">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="input-group">
                        <input type="text" id="login-email" placeholder="Usuário, Email ou Telefone" required>
                    </div>
                    <div class="input-group password-group">
                        <input type="password" id="login-password" placeholder="Senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn-primary" id="btn-entrar">Entrar</button>
                </form>
            </div>

            <hr class="divider">

            <!-- Register Form -->
            <div class="register-section">
                <h2>Cadastro</h2>
                <form id="register-form">
                    <div class="input-group">
                        <input type="text" id="reg-username" placeholder="Nome de usuário" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="reg-email" placeholder="Email ou Telefone" required>
                    </div>
                    <div class="input-group password-group">
                        <input type="password" id="reg-password" placeholder="Senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <div class="input-group password-group">
                        <input type="password" id="reg-password-confirm" placeholder="Repita sua senha" required>
                        <button type="button" class="toggle-password"
                            onclick="togglePassword('reg-password-confirm', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn-primary" id="btn-confirmar">Confirmar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.querySelector('svg').setAttribute('stroke', '#333');
            } else {
                input.type = 'password';
                btn.querySelector('svg').setAttribute('stroke', '#888');
            }
        }
    </script>
</body>

</html>
